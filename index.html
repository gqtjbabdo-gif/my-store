<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Professional Store</title>
    <style>
        /* General Page Styles */
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f4f9; text-align: center; margin: 0; padding: 20px; }
        h1 { color: #333; margin-bottom: 30px; }

        /* Container for products */
        .container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; }

        /* Product Card Design */
        .product-card { background: white; border-radius: 15px; padding: 20px; width: 260px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); transition: transform 0.3s; }
        .product-card:hover { transform: translateY(-10px); }
        .product-card img { width: 100%; height: 200px; object-fit: cover; border-radius: 10px; }
        
        .product-name { font-size: 1.2rem; color: #333; margin: 15px 0 10px; }
        .price { color: #28a745; font-size: 1.25rem; font-weight: bold; margin-bottom: 15px; }

        /* Button Design */
        .button { 
            display: block; background-color: #28a745; color: white; padding: 12px; 
            text-decoration: none; border-radius: 8px; font-weight: bold; transition: background 0.3s;
        }
        .button:hover { background-color: #218838; }
    </style>
</head>
<body>

    <h1>Our Featured Products</h1>

    <div class="container">
        
        <div class="product-card">
            <img src="https://via.placeholder.com/300" alt="Product">
            <div class="product-name">Product Name 1</div>
            <div class="price">$25.00</div>
            <a href="https://form.typeform.com/to/Mo8G8yNN" target="_blank" class="button">Order Now</a>
        </div>

        <div class="product-card">
            <img src="https://via.placeholder.com/300" alt="Product">
            <div class="product-name">Product Name 2</div>
            <div class="price">$40.00</div>
            <a href="https://form.typeform.com/to/Mo8G8yNN" target="_blank" class="button">Order Now</a>
        </div>

        <div class="product-card">
            <img src="https://via.placeholder.com/300" alt="Product">
            <div class="product-name">Product Name 3</div>
            <div class="price">$55.00</div>
            <a href="https://form.typeform.com/to/Mo8G8yNN" target="_blank" class="button">Order Now</a>
        </div>

    </div>

</body>
</html>
